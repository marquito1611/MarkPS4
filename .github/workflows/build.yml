name: Validate MarkPS4 assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  prepare:
    name: Validate theme assets and prepare preview
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install download tool
        run: python -m pip install --upgrade gdown

      - name: Download first theme PKG
        run: |
          mkdir -p app/packages
          gdown "1KK8yqBinHkxRbuLCY4O4tJzApXvPYm2n" \
            -O "app/packages/1-EP0001-CUSA09303_00-ACDNEWTHEME12345-A0000-V0100.pkg"

      - name: Download second theme PKG
        run: |
          gdown "1OXuuN5d7hLYxABRVHHP-Qz7AV6-CC1rR" \
            -O "app/packages/2-EP0001-CUSA09303_00-ACDNEWTHEME12345.pkg"
            
      - name: Verify project files and PKG signatures
        run: |
          echo "=== Archivos encontrados ==="
          find app -maxdepth 3 -type f -printf '%p (%s bytes)\n' || true

          echo "=== Comprobando archivos necesarios ==="
          for f in \
            app/source/main.cpp \
            app/Makefile \
            app/index.html \
            app/assets/assassins-creed.jpg \
            app/packages/1-EP0001-CUSA09303_00-ACDNEWTHEME12345-A0000-V0100.pkg \
            app/packages/2-EP0001-CUSA09303_00-ACDNEWTHEME12345.pkg
          do
            if test -s "$f"; then
              echo "OK: $f"
            else
              echo "FALTA O ESTA VACIO: $f" >&2
              exit 1
            fi
          done

      - name: Verify PS4 PKG headers
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path("app/packages/1-EP0001-CUSA09303_00-ACDNEWTHEME12345-A0000-V0100.pkg"),
              Path("app/packages/2-EP0001-CUSA09303_00-ACDNEWTHEME12345.pkg"),
          ]
          for path in files:
              with path.open("rb") as f:
                  header = f.read(5)
              if header != bytes([0x7f]) + b"CNT":
                  raise SystemExit(f"ERROR: {path.name} does not start with a PS4 PKG header")
              print(f"PKG header OK: {path.name} ({path.stat().st_size} bytes)")
          PY

      - name: Prepare interface and themes
        run: |
          mkdir -p build/MarkPS4
          cp app/index.html build/MarkPS4/
          cp -r app/assets build/MarkPS4/
          cp -r app/packages build/MarkPS4/

      - name: Upload prepared files
        uses: actions/upload-artifact@v4
        with:
          name: MarkPS4-preview-assets-not-installable
          path: build/MarkPS4/
          if-no-files-found: error
