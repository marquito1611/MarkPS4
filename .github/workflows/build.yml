name: Build MarkPS4

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare:
    name: Download MarkPS4 files
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install download tool
        run: |
          python -m pip install --upgrade gdown

      - name: Download first theme PKG
        run: |
          mkdir -p app/packages
          gdown "1KK8yqBinHkxRbuLCY4O4tJzApXvPYm2n" \
            -O "app/packages/1-EP0001-CUSA09303_00-ACDNEWTHEME12345-A0000-V0100.pkg"

      - name: Download second theme PKG
        run: |
          gdown "1OXuuN5d7hLYxABRVHHP-Qz7AV6-CC1rR" \
            -O "app/packages/2-EP0001-CUSA09303_00-ACDNEWTHEME12345.pkg"

      - name: Verify project files
        run: |
          test -f app/main.cpp
          test -f app/Makefile
          test -f app/index.html
          test -f app/assets/assassins-creed.jpg

          test -s app/packages/1-EP0001-CUSA09303_00-ACDNEWTHEME12345-A0000-V0100.pkg
          test -s app/packages/2-EP0001-CUSA09303_00-ACDNEWTHEME12345.pkg

          echo "All required files were found."

      - name: Prepare interface and themes
        run: |
          mkdir -p build/MarkPS4
          cp app/index.html build/MarkPS4/
          cp -r app/assets build/MarkPS4/
          cp -r app/packages build/MarkPS4/

      - name: Upload prepared files
        uses: actions/upload-artifact@v4
        with:
          name: MarkPS4-prepared-files
          path: build/MarkPS4/
          if-no-files-found: error
